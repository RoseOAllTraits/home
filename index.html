<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="Practice, RPG, and Play by roseoalltraits.">
  <link rel="icon" href="data:,">
  <title>Rose's Worlds</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="worlds" id="worlds" aria-label="Choose a project">
    <div class="world-grid">
      <article class="world-card practice">
        <div class="card-art practice-art" aria-hidden="true"><img src="./img/practice-note.png" alt=""></div>
        <div class="card-copy"><h1>Practice</h1><a class="button-link" href="https://roseoalltraits.github.io/Practice/" target="_blank" rel="noopener noreferrer"><span>Open</span><span aria-hidden="true">↗</span></a></div>
      </article>
      <article class="world-card play">
        <div class="card-art play-art" aria-hidden="true"><div class="playing-card card-back"><span>♣</span></div><div class="playing-card card-front"><span class="card-rank">A</span><span class="card-suit">♠</span><span class="card-rank bottom-rank">A</span></div></div>
        <div class="card-copy"><h2>Play</h2><a class="button-link" href="https://roseoalltraits.github.io/Play/" target="_blank" rel="noopener noreferrer"><span>Open</span><span aria-hidden="true">↗</span></a></div>
      </article>
      <article class="world-card rpg">
        <div class="card-art rpg-art" aria-hidden="true"><span class="rpg-moon"></span><span class="rpg-hill hill-back"></span><span class="rpg-hill hill-front"></span><span class="rpg-star star-one">✦</span><span class="rpg-star star-two">·</span><span class="rpg-star star-three">·</span></div>
        <div class="card-copy"><h2>Other</h2><a class="button-link" href="https://roseoalltraits.github.io/rpg/" target="_blank" rel="noopener noreferrer"><span>Open</span><span aria-hidden="true">↗</span></a></div>
      </article>
    </div>
  </main>
</body>
</html>
